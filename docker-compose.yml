# Local full-stack test harness -- build and run both services together
# before pushing to Render. Postgres/Redis here are for local parity;
# in production you'd point DATABASE_URL at Supabase instead (see
# SUPABASE_RENDER_DEPLOYMENT.md) -- nothing in the current codebase
# actually queries the database yet, so these are optional even locally.
#
# Usage:
#   cp backend/.env.example backend/.env
#   touch backend/.fyers_session.json   # IMPORTANT: create this file
#     BEFORE first `docker compose up`, otherwise Docker's bind-mount
#     silently creates a DIRECTORY at that path instead of a file
#     (handled gracefully by the app, but avoid it for a clean first run).
#   docker compose up --build
#   Backend:  http://localhost:8000/docs
#   Frontend: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: options_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      PORT: "8000"
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/.fyers_session.json:/app/.fyers_session.json
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
